l="#ff2bd6" letter-spacing="2">BUILD</text><text x="300" y="178" text-anchor="middle" font-size="14" font-family="'Segoe UI',Helvetica,Arial,sans-serif" fill="#c9b8ff">Hands-on labs</text><circle cx="500" cy="100" r="30" fill="#150b45" stroke="#ffd36b" stroke-width="3" filter="url(#gl)"><animate attributeName="r" values="28;33;28" dur="3s" begin="-1.2s" repeatCount="indefinite"/></circle><text x="500" y="108" text-anchor="middle" font-size="22" font-weight="900" font-family="'Segoe UI',Helvetica,Arial,sans-serif" fill="#fff">3</text><text x="500" y="156" text-anchor="middle" font-size="18" font-weight="900" font-family="'Segoe UI',Helvetica,Arial,sans-serif" fill="#ffd36b" letter-spacing="2">SHARE</text><text x="500" y="178" text-anchor="middle" font-size="14" font-family="'Segoe UI',Helvetica,Arial,sans-serif" fill="#c9b8ff">Publish free</text><circle cx="700" cy="100" r="30" fill="#150b45" stroke="#43e55e" stroke-width="3" filter="url(#gl)"><animate attributeName="r" values="28;33;28" dur="3s" begin="-1.7999999999999998s" repeatCount="indefinite"/></circle><text x="700" y="108" text-anchor="middle" font-size="22" font-weight="900" font-family="'Segoe UI',Helvetica,Arial,sans-serif" fill="#fff">4</text><text x="700" y="156" text-anchor="middle" font-size="18" font-weight="900" font-family="'Segoe UI',Helvetica,Arial,sans-serif" fill="#43e55e" letter-spacing="2">TEACH</text><text x="700" y="178" text-anchor="middle" font-size="14" font-family="'Segoe UI',Helvetica,Arial,sans-serif" fill="#c9b8ff">Help others grow</text><circle cx="900" cy="100" r="30" fill="#150b45" stroke="#ff8a3d" stroke-width="3" filter="url(#gl)"><animate attributeName="r" values="28;33;28" dur="3s" begin="-2.4s" repeatCount="indefinite"/></circle><text x="900" y="108" text-anchor="middle" font-size="22" font-weight="900" font-family="'Segoe UI',Helvetica,Arial,sans-serif" fill="#fff">5</text><text x="900" y="156" text-anchor="middle" font-size="18" font-weight="900" font-family="'Segoe UI',Helvetica,Arial,sans-serif" fill="#ff8a3d" letter-spacing="2">EVOLVE</text><text x="900" y="178" text-anchor="middle" font-size="14" font-family="'Segoe UI',Helvetica,Arial,sans-serif" fill="#c9b8ff">Keep shipping</text></svg>