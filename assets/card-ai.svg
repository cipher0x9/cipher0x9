  <rect width="800" height="460" fill="#EEEDFB"/>
  <rect width="800" height="12" fill="#33308A"/>
  <text x="48" y="78" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" letter-spacing="2.5" fill="#33308A">AI LAB FREE UNIVERSITY</text>
  <text x="48" y="138" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#1C2430">247 sections</text>
