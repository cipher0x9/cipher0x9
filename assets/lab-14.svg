<svg xmlns="http://www.w3.org/2000/svg" width="440" height="150" viewBox="0 0 440 150" role="img"><title>Python Lab</title>
<defs><style type="text/css"><![CDATA[
@keyframes blink { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
@keyframes dash { to { stroke-dashoffset: -180 } }
@keyframes drift { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-3px) } }
.cur { animation: blink 1.1s steps(1) infinite }
.dash { stroke-dasharray: 8 12; animation: dash 7s linear infinite }
.bob { animation: drift 4.5s ease-in-out infinite }
@media (prefers-reduced-motion: reduce) { .cur, .dash, .bob { animation: none } }
]]></style>
<linearGradient id="sbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1b3d"/><stop offset=".55" stop-color="#0a1024"/><stop offset="1" stop-color="#1a1604"/></linearGradient>
<radialGradient id="sgl" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#4b8bbe" stop-opacity=".55"/><stop offset="1" stop-color="#4b8bbe" stop-opacity="0"/></radialGradient>
<radialGradient id="sgy" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffd43b" stop-opacity=".35"/><stop offset="1" stop-color="#ffd43b" stop-opacity="0"/></radialGradient>
<linearGradient id="sb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8fc1ee"/><stop offset="1" stop-color="#2f6aa3"/></linearGradient>
<linearGradient id="sy" x1="1" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#fff0a0"/><stop offset="1" stop-color="#f0b400"/></linearGradient>
</defs>
<rect x="8" y="12" width="424" height="134" rx="18" fill="#000" opacity=".35"/><rect x="6" y="6" width="428" height="136" rx="18" fill="url(#sbg)"/>
<rect x="6" y="6" width="428" height="136" rx="18" fill="none" stroke="#ffd43b" stroke-width="2.5" stroke-dasharray="40 14"><animate attributeName="stroke-dashoffset" values="0;-108" dur="4s" repeatCount="indefinite"/></rect>
<g transform="translate(74 66)"><g transform="scale(0.95)"><circle r="46" fill="url(#sgl)"/><circle r="46" fill="url(#sgy)" transform="translate(10 12)"/>
<circle r="34" fill="#070d1e" stroke="#ffd43b" stroke-opacity=".8" stroke-width="2"/><circle r="42" fill="none" stroke="#4b8bbe" stroke-opacity=".6" stroke-width="1.4" class="dash"/>
<g class="bob" fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M-8 -22 C-24 -22 -24 -4 -8 -4 L8 -4" stroke="url(#sb)" stroke-width="9"/>
<path d="M8 22 C24 22 24 4 8 4 L-8 4" stroke="url(#sy)" stroke-width="9"/>
<path d="M-8 -22 L6 -22" stroke="url(#sb)" stroke-width="9"/><path d="M8 22 L-6 22" stroke="url(#sy)" stroke-width="9"/></g>
<circle cx="-11" cy="-22" r="2" fill="#071022"/><circle cx="11" cy="22" r="2" fill="#2a1d00"/></g></g>
<text x="136" y="58" fill="#fff" font-size="24" font-weight="700" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Python Lab</text><text x="136" y="82" fill="#ffd43b" font-size="14" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Python in your browser</text>
<text x="30" y="124" fill="#ffd43b" font-size="13" font-family="ui-monospace,SFMono-Regular,'Fira Code',Consolas,'Courier New',monospace" xml:space="preserve">&gt;&gt;&gt; <tspan fill="#82aaff">print</tspan><tspan fill="#d6e0ff">(</tspan><tspan fill="#a5e075">"hello"</tspan><tspan fill="#d6e0ff">)</tspan></text><rect class="cur" x="174" y="113" width="8" height="14" fill="#ffd43b"/>
