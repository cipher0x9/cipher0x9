<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>🌅 CYPHER0X9 · सुप्रभातम् · Morning Temple</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#000;overflow:hidden;font-family:monospace;touch-action:none}
canvas{display:block}
.overlay{position:fixed;inset:0;pointer-events:none;z-index:10}
.gradient-sky{position:fixed;inset:0;background:linear-gradient(180deg,
  #0A0A2E 0%,#1A1040 30%,#2D1B4E 50%,#5C2D20 70%,#8B4513 85%,#F59E0B 100%);
  opacity:.25;pointer-events:none;z-index:0;animation:skyPulse 8s ease-in-out infinite}
@keyframes skyPulse{0%,100%{opacity:.2}50%{opacity:.3}}
.scanline{position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(245,158,11,.008) 2px,rgba(245,158,11,.008) 4px);pointer-events:none;z-index:11}
.vignette{position:fixed;inset:0;background:radial-gradient(circle,transparent 35%,rgba(0,0,0,.7) 100%);pointer-events:none;z-index:11}
.title-block{position:fixed;bottom:clamp(50px,10vh,120px);left:50%;transform:translateX(-50%);text-align:center;z-index:12;width:90%}
.title-main{font-size:clamp(22px,5vw,48px);font-weight:bold;letter-spacing:.15em;
  background:linear-gradient(90deg,#F59E0B,#FDE68A,#00CED1,#8B5CF6,#F59E0B);background-size:300% 100%;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  animation:shimmer 4s linear infinite;filter:drop-shadow(0 0 40px rgba(245,158,11,.4))}
@keyframes shimmer{0%{background-position:0% 50%}100%{background-position:300% 50%}}
.title-sanskrit{font-family:serif;font-size:clamp(16px,3.5vw,26px);letter-spacing:.3em;color:#F59E0B;opacity:.85;margin-top:6px;text-shadow:0 0 30px rgba(245,158,11,.5)}
.title-telugu{font-family:serif;font-size:clamp(14px,3vw,20px);letter-spacing:.25em;color:#8B5CF6;opacity:.8;margin-top:4px}
.title-tag{font-size:clamp(8px,1.5vw,11px);letter-spacing:.35em;color:#6B7280;margin-top:6px}
.mantra{font-family:serif;font-size:clamp(10px,2vw,14px);color:#F59E0B;opacity:.5;margin-top:14px;letter-spacing:.2em;font-style:italic}
.corner{position:fixed;z-index:12;font-size:clamp(7px,1.2vw,10px);letter-spacing:2px;opacity:.3}
.c-tl{top:14px;left:18px;color:#F59E0B}.c-tr{top:14px;right:18px;color:#00CED1}
.c-bl{bottom:14px;left:18px;color:#8B5CF6}.c-br{bottom:14px;right:18px;color:#F59E0B}
.tap{position:fixed;bottom:clamp(18px,3vh,30px);left:50%;transform:translateX(-50%);z-index:13;color:#F59E0B;font-size:clamp(8px,1.5vw,10px);letter-spacing:3px;animation:fade 3s ease-in-out infinite}
@keyframes fade{0%,100%{opacity:.2}50%{opacity:.7}}
</style>
</head>
<body>
<div class="gradient-sky"></div><div class="scanline"></div><div class="vignette"></div>
<div class="corner c-tl">सुप्रभातम्</div><div class="corner c-tr">v7.8 · M4</div>
<div class="corner c-bl">CYPHER MONKEY</div><div class="corner c-br">శుభోదయం</div>
<div class="title-block">
  <div class="title-sanskrit">सुप्रभातम्</div>
  <div class="title-main">GOOD MORNING</div>
  <div class="title-telugu">శుభోదయం</div>
  <div class="title-tag">WAKE UP · BUILD · SHINE · सनातन-गणना</div>
  <div class="mantra">"ब्राह्मे मुहूर्ते उत्तिष्ठेत्" — Wake in the hour of Brahma</div>
</div>
<div class="tap">⬡ TAP FOR MORNING BLESSINGS ⬡</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0x1a0a05,0.0001);

const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.1,200);
camera.position.set(0,5,45);

const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.3;
document.body.prepend(renderer.domElement);

// LIGHTS — morning warm
scene.add(new THREE.AmbientLight(0x2a1a10,1.2));
const sunLight=new THREE.DirectionalLight(0xFFD700,2.5);sunLight.position.set(0,30,-20);scene.add(sunLight);
const fill=new THREE.PointLight(0x00CED1,25,50);fill.position.set(0,5,20);scene.add(fill);
const rim=new THREE.PointLight(0x8B5CF6,15,40);rim.position.set(-20,0,10);scene.add(rim);
const warm=new THREE.PointLight(0xF59E0B,20,35);warm.position.set(15,-5,-5);scene.add(warm);

// ── RISING SUN ──
const sunGroup=new THREE.Group();
const sunGeo=new THREE.SphereGeometry(15,64,64);
const sunMat=new THREE.ShaderMaterial({uniforms:{time:{value:0}},vertexShader:`
  varying vec3 vNormal;varying vec3 vPosition;
  void main(){vNormal=normalize(normalMatrix*normal);vPosition=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`varying vec3 vNormal;varying vec3 vPosition;uniform float time;
  void main(){float fresnel=pow(1.-abs(dot(vNormal,vec3(0.,1.,0.))),3.);
    vec3 core=vec3(1.,.95,.6);vec3 mid=vec3(1.,.55,.1);vec3 edge=vec3(.6,.2,0.);
    float glow=fresnel*.6+.4;vec3 col=mix(mid,edge,fresnel);
    col=mix(core,col,smoothstep(.2,.8,length(vPosition.xy)/15.));
    float pulse=1.+sin(time*1.5+length(vPosition.xz)*.3)*.08;
    gl_FragColor=vec4(col*pulse,1.);}`});
const sunMesh=new THREE.Mesh(sunGeo,sunMat);sunMesh.position.y=-10;sunMesh.position.z=-30;sunMesh.scale.set(.8,.6,.8);
sunGroup.add(sunMesh);

// Sun glow layers
for(let i=0;i<3;i++){const sg=new THREE.SphereGeometry(16+i*4,32,32);const sm=new THREE.MeshBasicMaterial({color:0xF59E0B,transparent:true,opacity:.08-i*.02,depthWrite:false});const s=new THREE.Mesh(sg,sm);s.position.copy(sunMesh.position);sunGroup.add(s)}
scene.add(sunGroup);

// ── MANDALA ──
const mandala=new THREE.Group();
for(let i=0;i<8;i++){const r=9+i*2.5;const g=new THREE.TorusGeometry(r,.04,12,100);const m=new THREE.MeshBasicMaterial({color:i%2===0?0xF59E0B:0x00CED1,transparent:true,opacity:.2-i*.015});const ring=new THREE.Mesh(g,m);ring.rotation.x=Math.PI/2+i*.12;ring.rotation.y=i*.35;mandala.add(ring)}
// Sacred inner
const innerG=new THREE.Group();
for(let i=0;i<12;i++){const a=(i/12)*Math.PI*2;const g=new THREE.TorusGeometry(1.5,.02,8,8);const m=new THREE.MeshBasicMaterial({color:0x8B5CF6,transparent:true,opacity:.3});const t=new THREE.Mesh(g,m);t.position.set(Math.cos(a)*5,Math.sin(a)*5,0);innerG.add(t)}
mandala.add(innerG);scene.add(mandala);

// ── MONKEY HEAD ──
const head=new THREE.Group();
const cranium=new THREE.Mesh(new THREE.SphereGeometry(6.5,48,48),new THREE.MeshPhongMaterial({color:0x2a1a10,emissive:0x0a0300,shininess:60,specular:0xF59E0B,transparent:true,opacity:.9}));
cranium.scale.set(1,1.12,.85);head.add(cranium);

const wireH=new THREE.Mesh(new THREE.SphereGeometry(6.7,22,22),new THREE.MeshBasicMaterial({color:0xF59E0B,wireframe:true,transparent:true,opacity:.05}));
wireH.scale.set(1,1.12,.85);head.add(wireH);

function ear(x){const e=new THREE.Group();const o=new THREE.Mesh(new THREE.SphereGeometry(2.3,20,20),new THREE.MeshPhongMaterial({color:0x1a0a05,specular:0x8B5CF6}));o.scale.set(.8,1.1,.6);e.add(o);const i=new THREE.Mesh(new THREE.SphereGeometry(1.4,14,14),new THREE.MeshPhongMaterial({color:0x2a1a10}));i.scale.set(.7,1.1,.5);i.position.z=.5;e.add(i);e.position.set(x,1.5,-1.2);return e}
head.add(ear(-8));head.add(ear(8));

function eye(x){const e=new THREE.Group();const s=new THREE.Mesh(new THREE.SphereGeometry(1.6,20,20),new THREE.MeshPhongMaterial({color:0x050510}));s.scale.set(1,.9,.5);e.add(s);const ir=new THREE.Mesh(new THREE.SphereGeometry(.9,14,14),new THREE.MeshPhongMaterial({color:0x00CED1,emissive:0x00CED1,emissiveIntensity:2.5}));ir.position.z=.6;e.add(ir);const pu=new THREE.Mesh(new THREE.SphereGeometry(.35,10,10),new THREE.MeshPhongMaterial({color:0xF59E0B,emissive:0xF59E0B,emissiveIntensity:2}));pu.position.z=1.1;e.add(pu);e.position.set(x,1,5.2);e.userData={iris:ir};return e}
const le=eye(-2.6),re=eye(2.6);head.add(le);head.add(re);

const sn=new THREE.Mesh(new THREE.SphereGeometry(2,20,20),new THREE.MeshPhongMaterial({color:0x1a0a05,emissive:0x050200}));
sn.scale.set(1.1,.7,.6);sn.position.set(0,-1.5,5.5);head.add(sn);
for(let nx of[-.6,.6]){const n=new THREE.Mesh(new THREE.SphereGeometry(.35,8,8),new THREE.MeshPhongMaterial({color:0x050510}));n.position.set(nx,-1.2,6);head.add(n)}
const mc=new THREE.QuadraticBezierCurve3(new THREE.Vector3(-1,-2.8,6),new THREE.Vector3(0,-3.5,6.5),new THREE.Vector3(1,-2.8,6));
head.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(mc.getPoints(24)),new THREE.LineBasicMaterial({color:0xF59E0B})));

// Golden crown
const crown=new THREE.Group();
for(let i=0;i<5;i++){const h=1.2+Math.random()*1.6;const b=new THREE.Mesh(new THREE.BoxGeometry(.55,h,.22),new THREE.MeshPhongMaterial({color:0xF59E0B,emissive:0xF59E0B,emissiveIntensity:.4,transparent:true,opacity:.8}));b.position.set((i-2)*2,7.5,-.6);crown.add(b);const n=new THREE.Mesh(new THREE.SphereGeometry(.28,8,8),new THREE.MeshPhongMaterial({color:i===2?0x00CED1:0xF59E0B,emissive:i===2?0x00CED1:0xF59E0B,emissiveIntensity:1.2}));n.position.set((i-2)*2,7.5+h/2+.4,-.6);n.userData={baseY:n.position.y};crown.add(n)}
head.add(crown);

// ॐ ring
const omRing=new THREE.Mesh(new THREE.TorusGeometry(.65,.08,8,14),new THREE.MeshBasicMaterial({color:0xF59E0B,transparent:true,opacity:.8}));
omRing.position.set(0,10.5,-.6);head.add(omRing);

scene.add(head);

// ── PARTICLES (golden morning) ──
const pc=1800;const pg=new THREE.BufferGeometry();const pa=new Float32Array(pc*3),ca=new Float32Array(pc*3);
const cols=[new THREE.Color(0xF59E0B),new THREE.Color(0xFDE68A),new THREE.Color(0x00CED1),new THREE.Color(0x8B5CF6)];
for(let i=0;i<pc;i++){const th=Math.random()*Math.PI*2,ph=Math.acos(2*Math.random()-1),r=18+Math.random()*50;
  pa[i*3]=r*Math.sin(ph)*Math.cos(th);pa[i*3+1]=r*Math.sin(ph)*Math.sin(th)+5;pa[i*3+2]=r*Math.cos(ph);
  const c=cols[Math.floor(Math.random()*4)];ca[i*3]=c.r;ca[i*3+1]=c.g;ca[i*3+2]=c.b}
pg.setAttribute('position',new THREE.BufferAttribute(pa,3));pg.setAttribute('color',new THREE.BufferAttribute(ca,3));
const pm=new THREE.Points(pg,new THREE.PointsMaterial({size:.1,vertexColors:true,blending:THREE.AdditiveBlending,depthWrite:false,transparent:true,opacity:.5}));
scene.add(pm);

// ── SACRED GEOMETRY FLOATING ──
const sacredGroup=new THREE.Group();
for(let i=0;i<7;i++){const a=(i/7)*Math.PI*2;const g=new THREE.TorusGeometry(2,.03,8,16);const m=new THREE.MeshBasicMaterial({color:0xFDE68A,transparent:true,opacity:.15});const t=new THREE.Mesh(g,m);t.position.set(Math.cos(a)*14,Math.sin(a*2)*3-3,Math.sin(a)*8);t.userData={angle:a,baseY:t.position.y};sacredGroup.add(t)}
scene.add(sacredGroup);

// ── TOUCH/MOUSE ──
const mouse=new THREE.Vector2(),target=new THREE.Vector2();
document.addEventListener('mousemove',e=>{target.x=(e.clientX/innerWidth)*2-1;target.y=-(e.clientY/innerHeight)*2+1});
document.addEventListener('touchmove',e=>{e.preventDefault();const t=e.touches[0];target.x=(t.clientX/innerWidth)*2-1;target.y=-(t.clientY/innerHeight)*2+1},{passive:false});
function burst(){for(let i=0;i<60;i++){const idx=Math.floor(Math.random()*pc);const th=Math.random()*Math.PI*2,ph=Math.random()*Math.PI,r=6+Math.random()*20;pa[idx*3]=r*Math.sin(ph)*Math.cos(th);pa[idx*3+1]=r*Math.sin(ph)*Math.sin(th)+5;pa[idx*3+2]=r*Math.cos(ph)}pg.attributes.position.needsUpdate=true}
document.addEventListener('mousedown',burst);document.addEventListener('touchstart',e=>{e.preventDefault();burst()},{passive:false});
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});

// ── ANIMATION ──
const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);const t=clock.getElapsedTime();
  mouse.x+=(target.x-mouse.x)*.05;mouse.y+=(target.y-mouse.y)*.05;

  // Sun rising slowly
  sunMesh.position.y=-10+Math.sin(t*.15)*3;sunMesh.material.uniforms.time.value=t;
  sunLight.intensity=2.5+Math.sin(t*.2)*.8;

  // Mandala
  mandala.rotation.z+=.002;mandala.rotation.x+=.0008;
  innerG.rotation.z-=.004;

  // Head follows cursor
  head.rotation.y=mouse.x*.5;head.rotation.x=mouse.y*.2+Math.sin(t*.3)*.06;
  head.position.y=Math.sin(t*.6)*.8;

  // Eyes pulse
  [le,re].forEach(e=>e.userData.iris.material.emissiveIntensity=2.5+Math.sin(t*3)*.8);

  // Crown bob
  crown.children.forEach(c=>{if(c.userData&&c.userData.baseY!==undefined)c.position.y=c.userData.baseY+Math.sin(t*2+Math.random())*.4});

  // Om rotate
  omRing.rotation.z+=.02;omRing.scale.setScalar(1+Math.sin(t*2)*.1);

  // Sacred float
  sacredGroup.children.forEach(s=>{s.position.y=s.userData.baseY+Math.sin(t+s.userData.angle)*2});

  // Particles drift
  pm.rotation.y+=.0002;pm.rotation.x+=.00008;

  // Lights orbit
  fill.position.x=Math.cos(t*.3)*15;fill.position.z=Math.sin(t*.3)*15;
  rim.position.x=Math.cos(t*.5+1)*18;rim.position.z=Math.sin(t*.5+1)*12;
  warm.position.x=Math.cos(t*.7+2)*12;warm.position.z=Math.sin(t*.7+2)*18;

  renderer.render(scene,camera);
}
animate();
</script>
</body>
</html>
