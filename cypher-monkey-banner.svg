<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" width="1500" height="500">
  <defs>
    <radialGradient id="bgLight" cx="30%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1E1B4B"/><stop offset="100%" stop-color="#0A0A1A"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00CED1"/><stop offset="50%" stop-color="#8B5CF6"/><stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="cyberLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00CED1" stop-opacity="0"/><stop offset="30%" stop-color="#00CED1" stop-opacity="0.8"/><stop offset="70%" stop-color="#8B5CF6" stop-opacity="0.8"/><stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>
    <filter id="glowS"><feGaussianBlur stdDeviation="2"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowM"><feGaussianBlur stdDeviation="4"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowL"><feGaussianBlur stdDeviation="8"/><feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <!-- BG -->
  <rect width="1500" height="500" fill="url(#bgLight)"/>

  <!-- Grid lines -->
  <g stroke="#8B5CF6" stroke-width="0.3" opacity="0.06">
    <line x1="0" y1="100" x2="1500" y2="100"/><line x1="0" y1="200" x2="1500" y2="200"/>
    <line x1="0" y1="300" x2="1500" y2="300"/><line x1="0" y1="400" x2="1500" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="500"/><line x1="600" y1="0" x2="600" y2="500"/>
    <line x1="900" y1="0" x2="900" y2="500"/><line x1="1200" y1="0" x2="1200" y2="500"/>
  </g>

  <!-- Mandala BG right side -->
  <g transform="translate(1280,250)" opacity="0.08">
    <circle r="220" fill="none" stroke="#8B5CF6" stroke-width="0.5"/>
    <circle r="200" fill="none" stroke="#00CED1" stroke-width="0.5"/>
    <circle r="180" fill="none" stroke="#8B5CF6" stroke-width="0.3"/>
    <circle r="160" fill="none" stroke="#F59E0B" stroke-width="0.3"/>
    <g fill="none" stroke="#00CED1" stroke-width="0.4">
      <polygon points="0,-200 173,-100 173,100 0,200 -173,100 -173,-100"/>
      <polygon points="0,-173 150,-87 150,87 0,173 -150,87 -150,-87" transform="rotate(30)"/>
    </g>
    <!-- Petal ring -->
    <g fill="#8B5CF6" opacity="0.3">
      <ellipse cx="0" cy="-140" rx="8" ry="25"/><ellipse cx="121" cy="-70" rx="8" ry="25" transform="rotate(30 121 -70)"/>
      <ellipse cx="121" cy="70" rx="8" ry="25" transform="rotate(-30 121 70)"/>
      <ellipse cx="0" cy="140" rx="8" ry="25"/><ellipse cx="-121" cy="70" rx="8" ry="25" transform="rotate(30 -121 70)"/>
      <ellipse cx="-121" cy="-70" rx="8" ry="25" transform="rotate(-30 -121 -70)"/>
    </g>
  </g>

  <!-- MONKEY FACE (left) -->
  <g transform="translate(220,250)">
    <!-- Ears -->
    <ellipse cx="-115" cy="-15" rx="42" ry="48" fill="#0F0F23" stroke="#8B5CF6" stroke-width="1.5" filter="url(#glowS)"/>
    <ellipse cx="-115" cy="-15" rx="22" ry="28" fill="#1A1333"/>
    <ellipse cx="115" cy="-15" rx="42" ry="48" fill="#0F0F23" stroke="#8B5CF6" stroke-width="1.5" filter="url(#glowS)"/>
    <ellipse cx="115" cy="-15" rx="22" ry="28" fill="#1A1333"/>

    <!-- Head -->
    <ellipse cx="0" cy="25" rx="110" ry="100" fill="#1A1333" stroke="url(#cyberLine)" stroke-width="2" filter="url(#glowM)"/>

    <!-- Crown / circuit top -->
    <g fill="#0F0F23" stroke="#00CED1" stroke-width="1.5" filter="url(#glowS)">
      <path d="M-85,-75 L-50,-95 L-25,-80 L0,-100 L25,-80 L50,-95 L85,-75 L60,-55 L0,-40 L-60,-55Z"/>
    </g>
    <!-- Data nodes on crown -->
    <circle cx="-50" cy="-90" r="3" fill="#00CED1" filter="url(#glowS)"/>
    <circle cx="0" cy="-95" r="4" fill="#F59E0B" filter="url(#glowS)"/>
    <circle cx="50" cy="-90" r="3" fill="#00CED1" filter="url(#glowS)"/>

    <!-- Eyes -->
    <g filter="url(#glowL)">
      <ellipse cx="-38" cy="10" rx="22" ry="20" fill="#0A0A1A" stroke="#F59E0B" stroke-width="1.5"/>
      <ellipse cx="-38" cy="10" rx="12" ry="14" fill="#00CED1"/>
      <ellipse cx="-38" cy="10" rx="5" ry="9" fill="#fff" opacity="0.7"/>
      <ellipse cx="-42" cy="6" rx="3" ry="2" fill="#fff" opacity="0.6"/>

      <ellipse cx="38" cy="10" rx="22" ry="20" fill="#0A0A1A" stroke="#F59E0B" stroke-width="1.5"/>
      <ellipse cx="38" cy="10" rx="12" ry="14" fill="#00CED1"/>
      <ellipse cx="38" cy="10" rx="5" ry="9" fill="#fff" opacity="0.7"/>
      <ellipse cx="34" cy="6" rx="3" ry="2" fill="#fff" opacity="0.6"/>
    </g>

    <!-- ॐ on forehead -->
    <text x="0" y="-75" text-anchor="middle" fill="#F59E0B" font-family="serif" font-size="32" filter="url(#glowM)" opacity="0.9">ॐ</text>

    <!-- Nose/Snout -->
    <ellipse cx="0" cy="38" rx="28" ry="22" fill="#120D2B" stroke="#8B5CF6" stroke-width="1.2"/>
    <ellipse cx="-10" cy="34" rx="6" ry="7" fill="#0A0A1A"/>
    <ellipse cx="10" cy="34" rx="6" ry="7" fill="#0A0A1A"/>

    <!-- Smile -->
    <path d="M-22,48 Q0,68 22,48" fill="none" stroke="#F59E0B" stroke-width="2" filter="url(#glowS)"/>

    <!-- Circuit cheek chips -->
    <g stroke="#00CED1" stroke-width="1" opacity="0.6" fill="none">
      <rect x="-100" y="15" width="18" height="18" rx="2"/>
      <line x1="-95" y1="15" x2="-95" y2="6"/><line x1="-86" y1="15" x2="-86" y2="6"/>
      <line x1="-100" y1="24" x2="-109" y2="24"/>
      <rect x="82" y="15" width="18" height="18" rx="2"/>
      <line x1="87" y1="15" x2="87" y2="6"/><line x1="96" y1="15" x2="96" y2="6"/>
      <line x1="100" y1="24" x2="109" y2="24"/>
    </g>
  </g>

  <!-- TITLE BLOCK (right) -->
  <g transform="translate(510,210)">
    <!-- Main title -->
    <text x="0" y="0" fill="#00CED1" font-family="monospace" font-size="64" font-weight="bold" filter="url(#glowL)" letter-spacing="10">
      CYPHER0X9
    </text>

    <!-- Sanskrit subtitle -->
    <text x="5" y="45" fill="#8B5CF6" font-family="serif" font-size="26" letter-spacing="8" filter="url(#glowM)">
      सन्ध्या-च्य्फेर्
    </text>

    <!-- Cyber divider -->
    <line x1="0" y1="65" x2="600" y2="65" stroke="url(#cyberLine)" stroke-width="2"/>

    <!-- Tagline -->
    <text x="5" y="95" fill="#6B7280" font-family="monospace" font-size="15" letter-spacing="6">
      सनातन-गणना
    </text>
    <text x="5" y="118" fill="#6B7280" font-family="sans-serif" font-size="13" letter-spacing="4" opacity="0.7">
      ANCIENT CODE · MODERN MIND · AUTONOMOUS SOUL
    </text>

    <!-- Status badges -->
    <g transform="translate(0,145)">
      <rect x="0" y="0" width="130" height="24" rx="12" fill="#00CED1" opacity="0.15" stroke="#00CED1" stroke-width="0.8"/>
      <text x="65" y="16" text-anchor="middle" fill="#00CED1" font-family="monospace" font-size="10">v7.8 ACTIVE</text>

      <rect x="145" y="0" width="140" height="24" rx="12" fill="#8B5CF6" opacity="0.15" stroke="#8B5CF6" stroke-width="0.8"/>
      <text x="215" y="16" text-anchor="middle" fill="#8B5CF6" font-family="monospace" font-size="10">MAC MINI M4</text>

      <rect x="300" y="0" width="130" height="24" rx="12" fill="#F59E0B" opacity="0.15" stroke="#F59E0B" stroke-width="0.8"/>
      <text x="365" y="16" text-anchor="middle" fill="#F59E0B" font-family="monospace" font-size="10">EVOLVING</text>
    </g>
  </g>

  <!-- Binary rain left edge -->
  <g opacity="0.06" fill="#00CED1" font-family="monospace" font-size="9">
    <text x="10" y="60">10110</text><text x="10" y="150">01101</text><text x="10" y="240">11010</text>
    <text x="10" y="330">00101</text><text x="10" y="420">10011</text><text x="10" y="490">01110</text>
  </g>

  <!-- Corner decorations -->
  <g stroke="#F59E0B" stroke-width="1.5" opacity="0.3" fill="none">
    <path d="M10,20 L10,8 L22,8"/><path d="M1478,8 L1490,8 L1490,20"/>
    <path d="M10,480 L10,492 L22,492"/><path d="M1478,492 L1490,492 L1490,480"/>
  </g>

  <!-- Data stream dots bottom -->
  <g fill="#00CED1" opacity="0.15">
    <circle cx="200" cy="485" r="2"/><circle cx="260" cy="485" r="1.5"/>
    <circle cx="320" cy="485" r="2"/><circle cx="400" cy="485" r="1"/>
    <circle cx="480" cy="485" r="2"/><circle cx="560" cy="485" r="1.5"/>
    <circle cx="700" cy="485" r="2"/><circle cx="780" cy="485" r="1"/>
    <circle cx="900" cy="485" r="2"/><circle cx="1000" cy="485" r="1.5"/>
    <circle cx="1100" cy="485" r="2"/><circle cx="1200" cy="485" r="1"/>
  </g>

</svg>
