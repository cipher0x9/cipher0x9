<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <!-- Gradients -->
    <radialGradient id="bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0F0F23"/>
    </radialGradient>
    <linearGradient id="cyber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00CED1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#00CED1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="strongGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bg)"/>
  
  <!-- Sacred Geometry Mandala -->
  <g transform="translate(400,340)" opacity="0.15" fill="none" stroke="#8B5CF6" stroke-width="0.5">
    <!-- Outer rings -->
    <circle r="300"/><circle r="280"/><circle r="260"/><circle r="240"/>
    <!-- Petals -->
    <g id="petal">
      <ellipse cx="0" cy="-200" rx="30" ry="70" fill="#8B5CF6" opacity="0.3"/>
      <ellipse cx="0" cy="-200" rx="15" ry="50" fill="#00CED1" opacity="0.2"/>
    </g>
    <use href="#petal" transform="rotate(30)"/><use href="#petal" transform="rotate(60)"/>
    <use href="#petal" transform="rotate(90)"/><use href="#petal" transform="rotate(120)"/>
    <use href="#petal" transform="rotate(150)"/><use href="#petal" transform="rotate(180)"/>
    <use href="#petal" transform="rotate(210)"/><use href="#petal" transform="rotate(240)"/>
    <use href="#petal" transform="rotate(270)"/><use href="#petal" transform="rotate(300)"/>
    <use href="#petal" transform="rotate(330)"/>
    <!-- Hexagon -->
    <polygon points="0,-200 173,-100 173,100 0,200 -173,100 -173,-100" stroke-width="1" stroke="#00CED1" opacity="0.5"/>
  </g>

  <!-- Monkey Face -->
  <g transform="translate(400,310)">
    <!-- Head base -->
    <ellipse cx="0" cy="20" rx="100" ry="90" fill="#2D1B4E" stroke="url(#cyber)" stroke-width="2" filter="url(#glow)"/>
    
    <!-- Ears -->
    <ellipse cx="-105" cy="-20" rx="35" ry="40" fill="#1E1B4B" stroke="#8B5CF6" stroke-width="2"/>
    <ellipse cx="-105" cy="-20" rx="20" ry="25" fill="#2D1B4E"/>
    <ellipse cx="105" cy="-20" rx="35" ry="40" fill="#1E1B4B" stroke="#8B5CF6" stroke-width="2"/>
    <ellipse cx="105" cy="-20" rx="20" ry="25" fill="#2D1B4E"/>
    
    <!-- Top head (digital circuit side) -->
    <path d="M-80,-70 L-40,-85 L0,-65 L40,-85 L80,-70 L60,-50 L0,-40 L-60,-50Z" fill="#1E1B4B" stroke="#00CED1" stroke-width="1.5" filter="url(#glow)"/>
    
    <!-- Circuit lines on head -->
    <g stroke="#00CED1" stroke-width="1" opacity="0.7" fill="none">
      <path d="M20,-85 L20,-65 L40,-50"/>
      <path d="M-20,-85 L-20,-65 L-40,-50"/>
      <circle cx="20" cy="-75" r="2" fill="#00CED1"/>
      <circle cx="-20" cy="-75" r="2" fill="#00CED1"/>
    </g>
    
    <!-- Eyes -->
    <ellipse cx="-35" cy="5" rx="20" ry="18" fill="#0F0F23" stroke="#F59E0B" stroke-width="1.5"/>
    <ellipse cx="-35" cy="5" rx="10" ry="12" fill="#00CED1" filter="url(#strongGlow)"/>
    <ellipse cx="-35" cy="5" rx="4" ry="8" fill="#fff" opacity="0.8"/>
    
    <ellipse cx="35" cy="5" rx="20" ry="18" fill="#0F0F23" stroke="#F59E0B" stroke-width="1.5"/>
    <ellipse cx="35" cy="5" rx="10" ry="12" fill="#00CED1" filter="url(#strongGlow)"/>
    <ellipse cx="35" cy="5" rx="4" ry="8" fill="#fff" opacity="0.8"/>
    
    <!-- Nose / snout -->
    <ellipse cx="0" cy="35" rx="25" ry="20" fill="#1E1B4B" stroke="#8B5CF6" stroke-width="1.5"/>
    <ellipse cx="-8" cy="30" rx="5" ry="6" fill="#0F0F23"/>
    <ellipse cx="8" cy="30" rx="5" ry="6" fill="#0F0F23"/>
    
    <!-- Mouth - slight smile -->
    <path d="M-20,45 Q0,60 20,45" fill="none" stroke="#F59E0B" stroke-width="2" filter="url(#glow)"/>
    
    <!-- Sanskrit lettering on forehead -->
    <text x="0" y="-90" text-anchor="middle" fill="#F59E0B" font-family="serif" font-size="28" filter="url(#glow)" opacity="0.9">ॐ</text>
    
    <!-- Chip/circuit on left side of head -->
    <g transform="translate(-80,-10)" stroke="#00CED1" stroke-width="1" fill="none" opacity="0.8">
      <rect x="-15" y="-15" width="30" height="30" rx="3"/>
      <line x1="-7" y1="-15" x2="-7" y2="-22"/>
      <line x1="7" y1="-15" x2="7" y2="-22"/>
      <line x1="-15" y1="-7" x2="-22" y2="-7"/>
      <line x1="-15" y1="7" x2="-22" y2="7"/>
      <line x1="15" y1="0" x2="22" y2="0"/>
    </g>
  </g>

  <!-- Digital rain / matrix effect left -->
  <g opacity="0.12" fill="#00CED1" font-family="monospace" font-size="10">
    <text x="30" y="80">10110</text><text x="30" y="160">01001</text><text x="30" y="240">11010</text>
    <text x="30" y="400">00101</text><text x="30" y="480">10011</text><text x="30" y="560">01110</text>
  </g>

  <!-- Digital rain right -->
  <g opacity="0.12" fill="#8B5CF6" font-family="monospace" font-size="10">
    <text x="740" y="100">0110</text><text x="740" y="180">1001</text><text x="740" y="340">1100</text>
    <text x="740" y="500">0011</text><text x="740" y="580">1010</text>
  </g>

  <!-- Main Title -->
  <text x="400" y="660" text-anchor="middle" fill="url(#cyber)" font-family="monospace" font-size="52" font-weight="bold" filter="url(#strongGlow)" letter-spacing="8">
    CYPHER0X9
  </text>

  <!-- Subtitle -->
  <text x="400" y="695" text-anchor="middle" fill="#8B5CF6" font-family="serif" font-size="22" letter-spacing="6" opacity="0.8">
    सन्ध्या-च्य्फेर्
  </text>

  <!-- Tagline -->
  <text x="400" y="725" text-anchor="middle" fill="#6B7280" font-family="monospace" font-size="13" letter-spacing="3">
    सनातन-गणना · ETERNAL COMPUTATION
  </text>

  <!-- Corner marks -->
  <g stroke="#F59E0B" stroke-width="1.5" opacity="0.5" fill="none">
    <path d="M20,30 L20,10 L40,10"/><path d="M760,10 L780,10 L780,30"/>
    <path d="M20,770 L20,790 L40,790"/><path d="M760,790 L780,790 L780,770"/>
  </g>

  <!-- Bottom line -->
  <line x1="200" y1="750" x2="600" y2="750" stroke="#00CED1" stroke-width="0.5" opacity="0.3"/>
  
  <!-- Small 3rd eye / tilak -->
  <circle cx="400" cy="230" r="5" fill="#F59E0B" filter="url(#strongGlow)" opacity="0.6"/>

</svg>
