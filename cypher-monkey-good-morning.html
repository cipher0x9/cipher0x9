<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🌅 CYPHER0X9 · Good Morning</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0A0A1A;overflow:hidden;font-family:monospace;display:flex;justify-content:center;align-items:center;min-height:100vh}
.stars{position:fixed;inset:0;z-index:0}
.star{position:absolute;background:#fff;border-radius:50%;animation:twinkle 3s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.1}50%{opacity:.5}}
.sun{position:fixed;bottom:-200px;left:50%;transform:translateX(-50%);
  width:400px;height:400px;border-radius:50%;
  background:radial-gradient(circle,#FDE68A,#F59E0B 30%,#EA580C 60%,transparent 70%);
  animation:sunrise 8s ease-out;opacity:.7;z-index:0;
  box-shadow:0 0 150px rgba(245,158,11,.4),0 0 300px rgba(245,158,11,.2);}
@keyframes sunrise{from{bottom:-400px;opacity:0}to{bottom:-100px;opacity:.7}}
.rays{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);z-index:0}
.ray{position:absolute;width:1px;height:200px;background:#F59E0B;
  transform-origin:bottom center;opacity:0;animation:rayFade 8s ease-out infinite}
.ray:nth-child(1){transform:rotate(-60deg);animation-delay:0s}
.ray:nth-child(2){transform:rotate(-30deg);animation-delay:.5s}
.ray:nth-child(3){transform:rotate(0deg);animation-delay:1s}
.ray:nth-child(4){transform:rotate(30deg);animation-delay:1.5s}
.ray:nth-child(5){transform:rotate(60deg);animation-delay:2s}
@keyframes rayFade{0%{opacity:0;height:0}20%{opacity:.3;height:200px}100%{opacity:0;height:300px}}

.container{position:relative;z-index:1;text-align:center;margin-top:-60px}
.monkey{font-size:80px;animation:float 4s ease-in-out infinite;filter:drop-shadow(0 0 40px rgba(0,206,209,.4))}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-18px)}}
.sanskrit{font-family:serif;font-size:32px;color:#F59E0B;letter-spacing:8px;
  animation:fadeIn 2s ease-out;text-shadow:0 0 30px rgba(245,158,11,.5)}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:.9;transform:translateY(0)}}
.title{font-size:clamp(28px,6vw,52px);font-weight:bold;letter-spacing:.2em;
  background:linear-gradient(90deg,#F59E0B,#00CED1,#8B5CF6);background-size:300% 100%;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  animation:shimmer 4s ease-in-out infinite;margin:10px 0}
@keyframes shimmer{0%,100%{background-position:0% 50%}50%{background-position:300% 50%}}
.telugu{font-family:serif;font-size:22px;color:#8B5CF6;letter-spacing:5px;opacity:.8;margin:6px 0}
.tagline{font-size:12px;letter-spacing:5px;color:#6B7280;margin:8px 0}
.mantra{font-family:serif;font-size:16px;color:#F59E0B;opacity:.7;margin:20px 0 0;font-style:italic}
.particles{position:fixed;inset:0;pointer-events:none;z-index:2}
.footer{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  font-size:10px;letter-spacing:3px;color:#6B7280;opacity:.5;z-index:2}
</style>
</head>
<body>

<div class="stars" id="stars"></div>
<div class="sun"></div>
<div class="rays"><div class="ray"></div><div class="ray"></div><div class="ray"></div><div class="ray"></div><div class="ray"></div></div>
<canvas class="particles" id="particles"></canvas>

<div class="container">
  <div class="monkey">🐵</div>
  <div class="sanskrit">सुप्रभातम्</div>
  <div class="title">GOOD MORNING</div>
  <div class="telugu">శుభోదయం</div>
  <div class="tagline">WAKE UP · BUILD · SHINE · सनातन-गणना</div>
  <div class="mantra">"ब्राह्मे मुहूर्ते उत्तिष्ठेत्" — Wake in the hour of Brahma</div>
</div>
<div class="footer">🐵 Cypher🐵MONKey🐒 · v7.8 · 🔱</div>

<script>
// Stars
const starsEl=document.getElementById('stars');
for(let i=0;i<60;i++){
  const s=document.createElement('div');s.className='star';
  s.style.left=Math.random()*100+'%';s.style.top=Math.random()*50+'%';
  s.style.width=s.style.height=Math.random()*2.5+0.5+'px';
  s.style.animationDelay=Math.random()*4+'s';
  s.style.animationDuration=(Math.random()*3+2)+'s';
  starsEl.appendChild(s);
}

// Particles
const c=document.getElementById('particles'),ctx=c.getContext('2d');
let W=c.width=innerWidth,H=c.height=innerHeight;
window.addEventListener('resize',()=>{W=c.width=innerWidth;H=c.height=innerHeight});

const pts=[];
for(let i=0;i<50;i++)pts.push({x:Math.random()*W,y:Math.random()*H,vy:-Math.random()*0.4-0.1,size:Math.random()*2+0.5,alpha:Math.random()*.5+.2,color:['#F59E0B','#00CED1','#8B5CF6'][Math.floor(Math.random()*3)]});

function draw(){
  ctx.clearRect(0,0,W,H);
  pts.forEach(p=>{p.y+=p.vy;if(p.y<-10){p.y=H+10;p.x=Math.random()*W}
    ctx.globalAlpha=p.alpha;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill()});
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
