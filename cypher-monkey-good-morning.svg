<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="sunrise" cx="50%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.25"/>
      <stop offset="40%" stop-color="#8B5CF6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0A0A1A" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDE68A"/><stop offset="30%" stop-color="#F59E0B"/>
      <stop offset="70%" stop-color="#EA580C"/><stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/><stop offset="40%" stop-color="#00CED1"/><stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowL"><feGaussianBlur stdDeviation="10"/><feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <!-- Background sky -->
  <rect width="800" height="800" fill="#0A0A1A"/>
  <rect width="800" height="800" fill="url(#sunrise)"/>

  <!-- Stars fading -->
  <g fill="#00CED1" opacity="0.15">
    <circle cx="120" cy="80" r="1"/><circle cx="680" cy="60" r="1.5"/><circle cx="200" cy="150" r="0.8"/>
    <circle cx="600" cy="120" r="1.2"/><circle cx="350" cy="40" r="1"/><circle cx="720" cy="180" r="0.7"/>
    <circle cx="80" cy="200" r="1.1"/><circle cx="500" cy="90" r="0.9"/><circle cx="150" cy="250" r="0.6"/>
  </g>

  <!-- Rising Sun -->
  <circle cx="400" cy="520" r="120" fill="url(#sun)" filter="url(#glowL)" opacity="0.9"/>
  <circle cx="400" cy="520" r="80" fill="#FDE68A" opacity="0.3"/>

  <!-- Sun rays -->
  <g stroke="#F59E0B" stroke-width="1" opacity="0.2" fill="none">
    <line x1="400" y1="400" x2="400" y2="300"/><line x1="400" y1="400" x2="500" y2="320"/>
    <line x1="400" y1="400" x2="300" y2="320"/><line x1="400" y1="400" x2="550" y2="420"/>
    <line x1="400" y1="400" x2="250" y2="420"/><line x1="400" y1="400" x2="520" y2="510"/>
    <line x1="400" y1="400" x2="280" y2="510"/>
  </g>

  <!-- Mountains / Ground -->
  <path d="M0,550 L150,460 L280,520 L400,440 L520,510 L650,450 L800,530 L800,800 L0,800Z" fill="#0F0F23" stroke="#1E1B4B" stroke-width="1"/>
  <path d="M0,600 L200,520 L350,570 L450,510 L600,560 L700,530 L800,580 L800,800 L0,800Z" fill="#1A1333"/>

  <!-- CYPHER MONKEY (small, centered above sun) -->
  <g transform="translate(400,290)">
    <!-- Head -->
    <ellipse cx="0" cy="10" rx="55" ry="50" fill="#1A1333" stroke="#00CED1" stroke-width="2" filter="url(#glow)"/>
    <!-- Ears -->
    <ellipse cx="-58" cy="-10" rx="20" ry="22" fill="#0F0F23" stroke="#8B5CF6" stroke-width="1.5"/>
    <ellipse cx="58" cy="-10" rx="20" ry="22" fill="#0F0F23" stroke="#8B5CF6" stroke-width="1.5"/>
    <!-- Crown -->
    <path d="M-45,-40 L-28,-52 L-14,-45 L0,-55 L14,-45 L28,-52 L45,-40 L30,-30 L0,-22 L-30,-30Z" fill="#0F0F23" stroke="#00CED1" stroke-width="1.5"/>
    <!-- Eyes -->
    <ellipse cx="-20" cy="4" rx="11" ry="10" fill="#0A0A1A" stroke="#F59E0B" stroke-width="1"/>
    <ellipse cx="-20" cy="4" rx="6" ry="7" fill="#00CED1" filter="url(#glow)" opacity="0.9"/>
    <ellipse cx="20" cy="4" rx="11" ry="10" fill="#0A0A1A" stroke="#F59E0B" stroke-width="1"/>
    <ellipse cx="20" cy="4" rx="6" ry="7" fill="#00CED1" filter="url(#glow)" opacity="0.9"/>
    <!-- ॐ -->
    <text x="0" y="-38" text-anchor="middle" fill="#F59E0B" font-family="serif" font-size="16" filter="url(#glow)">ॐ</text>
    <!-- Smile -->
    <path d="M-10,20 Q0,30 10,20" fill="none" stroke="#F59E0B" stroke-width="1.5"/>
  </g>

  <!-- MORNING TEXT -->
  <text x="400" y="190" text-anchor="middle" fill="#F59E0B" font-family="serif" font-size="28" letter-spacing="8" filter="url(#glow)" opacity="0.9">
    सुप्रभातम्
  </text>
  <text x="400" y="225" text-anchor="middle" fill="#00CED1" font-family="monospace" font-size="15" letter-spacing="6" opacity="0.7">
    SUPRIBHATAM
  </text>

  <!-- MAIN TITLE (bottom) -->
  <text x="400" y="670" text-anchor="middle" fill="url(#titleGrad)" font-family="monospace" font-size="42" font-weight="bold" letter-spacing="8" filter="url(#glow)">
    GOOD MORNING
  </text>

  <!-- Telugu -->
  <text x="400" y="705" text-anchor="middle" fill="#8B5CF6" font-family="serif" font-size="20" letter-spacing="4" opacity="0.8">
    శుభోదయం
  </text>

  <!-- Tagline -->
  <text x="400" y="735" text-anchor="middle" fill="#6B7280" font-family="monospace" font-size="10" letter-spacing="4">
    WAKE UP · BUILD · SHINE · सनातन-गणना
  </text>

  <!-- Bottom signature -->
  <text x="400" y="765" text-anchor="middle" fill="#6B7280" font-family="monospace" font-size="8" letter-spacing="2" opacity="0.5">
    🐵 Cypher🐵MONKey🐒 · v7.8
  </text>

  <!-- Corner decorations -->
  <g stroke="#F59E0B" stroke-width="1" opacity="0.3" fill="none">
    <path d="M15,25 L15,10 L30,10"/><path d="M770,10 L785,10 L785,25"/>
    <path d="M15,775 L15,790 L30,790"/><path d="M770,790 L785,790 L785,775"/>
  </g>

</svg>
